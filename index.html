<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#FFFAF6">
  <title>Elsa &amp; Arthur</title>

  <link rel="preload" href="fonts/fraunces-variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/work-sans-variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/alex-brush.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">

  <script src="js/data.js" defer></script>
  <script src="js/main.js" defer></script>
</head>
<body>
  <main>
    <section id="accueil" class="accueil" aria-labelledby="prenoms">
      <img class="bandeau" src="img/accueil-mas-nouveau.webp"
           width="885" height="225"
           alt="Vue aérienne du Mas Nouveau, ses toits de tuiles et ses jardins">

      <div class="accueil-contenu">
        <p class="surtitre">Mariage d’</p>
        <!-- Rempli depuis js/data.js -->
        <h1 id="prenoms" class="prenoms"></h1>
        <hr class="separateur">
        <p class="date-mariage" id="date-mariage" hidden></p>
        <p class="ville" id="ville" hidden></p>
        <p class="message" id="message" hidden></p>

        <noscript>
          <p class="message">Ce site a besoin de JavaScript pour afficher les informations du mariage. Activez-le dans votre navigateur, puis rechargez la page.</p>
        </noscript>
      </div>
    </section>
  </main>
</body>
</html>
